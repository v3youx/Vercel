  <title>NAVIQ | Welcome</title>
  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <script>
    // Seamless redirect to InfinityFree main site while preserving query parameters
    (function() {
      const targetUrl = "https://resolven.infinityfree.io/index.php" + window.location.search;
      window.location.replace(targetUrl);
    })();
  </script>
  <style>
    :root {
        --violet: #4b287c;
        --green: #22c264;
        --ink: #201d28;
        font-family: Arial, sans-serif;
        color: var(--ink);
    }
    html, body { width: 100%; height: 100%; margin: 0; background: #eeeaf4; }
    .chooser {
        position: relative; display: block; min-height: 100vh;
        background: #74608e url('images/renewable-energy.jpeg') center center/cover no-repeat;
    }
    .chooser:before {
        position: absolute; inset: 0; content: '';
        background: linear-gradient(104deg, rgba(65,28,113,.91) 0%, rgba(80,47,133,.85) 31%, rgba(122,91,166,.72) 58%, rgba(218,212,233,.68) 100%);
    }
    .chooser-content {
        position: absolute; z-index: 2; top: 18.7%; left: 0; width: min(520px, 40vw); min-width: 330px;
    }
    .logo-plaque {
        display: flex; align-items: center; padding: 22px 36px 22px 32px; background: #fff;
        clip-path: polygon(0 0, 100% 0, 92.5% 100%, 0 100%);
    }
    .logo-svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <main class="chooser" id="chooser-view">
    <div class="chooser-content">
