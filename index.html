<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // URL se email parameter nikalna (jaise ?email=abc@resolven.com)
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        // Target portal URL jahan InfinityFree par setup hai
        const portalUrl = "https://resolven.infinityfree.io/" + (email ? "?email=" + encodeURIComponent(email) : "");

        if (email) {
            // Background mein InfinityFree index.php ko hit karna taaki 'Yes' update ho jaye
            fetch('https://resolven.infinityfree.io/?email=' + encodeURIComponent(email), {
                mode: 'no-cors'
            }).catch(e => {});
        }

        // Turant main portal par redirect karna
        window.location.replace(portalUrl);
    </script>
</head>
<body>
    <p>Redirecting to portal... <a href="https://resolven.infinityfree.io">Click here if not redirected</a>.</p>
</body>
</html>
