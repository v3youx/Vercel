<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const name = urlParams.get('name');

        // 1. Background me InfinityFree wale track.php ko hit karega taaki dash me click update ho jaye
        if (email) {
            fetch("https://resolven.infinityfree.io/track.php?" + (email ? "email=" + encodeURIComponent(email) : "") + (name ? "&name=" + encodeURIComponent(name) : ""), {
                method: 'GET',
                mode: 'no-cors' // Cross-origin request ke liye
            }).catch(err => console.log(err));
        }

        // 2. Turant user ko resolven.infinityfree.io par redirect kar dega
        setTimeout(() => {
            window.location.replace("https://resolven.infinityfree.io/" + (email ? "?email=" + encodeURIComponent(email) : ""));
        }, 300); // Thoda delay taaki fetch request execute ho sake
    </script>
</head>
<body>
</body>
</html>
