<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        const email = new URLSearchParams(window.location.search).get('email');
        if (email) {
            navigator.sendBeacon('https://resolven.infinityfree.io/update_click.php', JSON.stringify({ email: email, clicked: 'Yes' }));
        }
        window.location.replace("https://resolven.infinityfree.io");
    </script>
</head>
<body>
    <p>Redirecting... <a href="https://resolven.infinityfree.io">Click here if not redirected</a>.</p>
</body>
</html>
