<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // URL ke parameters (jaise ?email=...) ko pakdo
        const queryString = window.location.search;
        
        // InfinityFree par bani nayi track.php file par redirect karo
        const targetUrl = "https://resolven.infinityfree.io/track.php" + queryString;
        
        window.location.replace(targetUrl);
    </script>
</head>
